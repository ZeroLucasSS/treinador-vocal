<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#101114"
    >

    <title>
        Biblioteca — Treinador Vocal
    </title>


    <link
        rel="stylesheet"
        href="./css/library.css"
    >

</head>


<body>

    <main class="app">

        <!-- ==================================================
             CABEÇALHO
             ================================================== -->

        <header class="cabecalho">

            <a
                href="./index.html"
                class="voltar"
            >
                ← Exercícios
            </a>


            <p class="etapa">
                TREINO COM MÚSICAS
            </p>


            <h1>
                Biblioteca
            </h1>


            <p class="descricao">
                Escolha uma música e pratique sobre
                o acompanhamento instrumental.
            </p>

        </header>



        <!-- ==================================================
             STATUS
             ================================================== -->

        <section
            id="estadoBiblioteca"
            class="estado-biblioteca"
        >
            Carregando músicas...
        </section>



        <!-- ==================================================
             CATÁLOGO
             ================================================== -->

        <div
            id="catalogoMusicas"
            class="catalogo-musicas"
        >
        </div>



        <!-- ==================================================
             RODAPÉ
             ================================================== -->

        <footer class="rodape">

            <p>
                As músicas disponíveis foram previamente
                preparadas para o treinamento vocal.
            </p>

        </footer>

    </main>


    <script
        type="module"
        src="./js/library.js"
    ></script>

</body>

</html>
